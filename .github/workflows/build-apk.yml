name: Build Mehrab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          rm -rf mehrab
          mkdir mehrab
          unzip -q "Mehrab_Android_Full_v1.1.zip" -d mehrab
          echo "=== Extracted files ==="
          find mehrab -maxdepth 4 -type f | head -100

      - name: Find Android project
        run: |
          PROJECT=$(find mehrab -name settings.gradle -type f -print -quit | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Android project found at: $PROJECT"

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mehrab-APK
          path: "${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
